# Explorer app + API proxy with a 10 s micro-cache on authenticated GETs.
# The cache key includes the Authorization header hash so workspaces never
# share entries; ingest POSTs bypass the cache entirely.
proxy_cache_path /var/cache/nginx/relspec levels=1:2 keys_zone=api:16m
                 max_size=256m inactive=5m use_temp_path=off;

server {
    listen 80;
    client_max_body_size 32m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_cache api;
        proxy_cache_methods GET;
        proxy_cache_key "$request_uri|$http_authorization";
        proxy_cache_valid 200 10s;
        proxy_cache_use_stale updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /health {
        proxy_pass http://api:8000;
    }
}
